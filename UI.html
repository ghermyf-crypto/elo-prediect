<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>White Player Elo Predictor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
  

  <style>
    .background {
      position: relative;
    }
    .background::before {
      content: "";
      position: fixed;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      background-image: linear-gradient(rgba(128, 128, 128, 0.5), rgba(128, 128, 128, 0.5)), url("https://media.gettyimages.com/id/1428445836/photo/close-up-of-a-chessboard-focus-on-the-king-and-queen.jpg?s=2048x2048&w=gi&k=20&c=DU0Mbo42dRf_0Jyg_GLYLba6cEKKofd_L5RN-dJzKHY=");
      background-size: cover;
      background-position: center;
      filter: blur(5px);
      z-index: -1;
    }
    .black_box {
      width: 750px;
      min-height: 450px;
      border-radius: 25px;
      background-color: white;
      background-image: linear-gradient(to top, black, #494949, #8b8989, #b8b7b7);
      color: white;
      padding: 40px;
      margin: 40px auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      font-family: 'Ubuntu', sans-serif;
      box-sizing: border-box;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 16px;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #fdfdfd;
      background: #dbdbdb;
      color: #000000;
      font-size: 14px;
      font-family: 'Ubuntu', sans-serif;
      box-sizing: border-box;
    }

    /* Sets input placeholder text to solid black */
    .form-group input::placeholder {
      color: #000000;
      opacity: 1;
    }

    .divider {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
      color: #00000091;
    }
    .predict-btn {
      width: 100%;
      padding: 14px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }
    .predict-btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

<div class="background">
  <header>
    <h1 style="text-align: center; font-family: 'Oswald', sans-serif; font-weight: bold; color: whitesmoke; margin-top: 80px; font-size: 60px">
      White Player Elo Predictor
    </h1>
  </header>

  <div class="black_box">
    <h2 style="text-align: center; font-size: 32px; margin-bottom: 25px;">
      White Elo Prediction
    </h2>

    <div class="form-group">
      <label for="miss">Input the Amount of Mistakes</label>
      <input type="number" id="miss" placeholder="ex: 10">
    </div>

    <div class="divider">— and —</div>

    <div class="form-group">
      <label for="inac">Input the Amount of Inaccuracies</label>
      <input type="number" id="inac" placeholder="ex: 1 or 15">
    </div>

    <div class="divider">— and —</div>

    <div class="form-group">
      <label for="moves">Input the Amount of Total Moves</label>
      <input type="number" id="moves" placeholder="ex: 35">
    </div>

    <div class="divider">— and —</div>

    <div class="form-group">
      <label for="Result_1-0">Who Won True is Whtie, Flase is Black?</label>
      <select id="Result_1-0">
        <option value="1">True</option>
        <option value="0" selected>False</option>
      </select>
    </div>

    <div class="divider">— and —</div>

    <div class="form-group">
      <label for="Result_1/2-1/2">Was the Game a Draw?</label>
      <select id="Result_1/2-1/2">
        <option value="1">True</option>
        <option value="0" selected>False</option>
      </select>
    </div>

    <button class="predict-btn" id="result">Predict Elo</button>
  </div>

  <div class="black_box">
    <header style="text-align: center; font-size: 45px; margin-bottom: 25px; font-weight: bold;">
      Predicted Elo
    </header>
    <h1 style="text-align: center; color: #60a5fa; font-size: 100px; font-weight: 800; letter-spacing: 2px; margin: 0; text-shadow: 0 0 15px #2563eb, 0 0 30px #2563eb, 0 0 45px #60a5fa, 0 0 60px #60a5fa;">
      <span id="output">--</span>
    </h1>
  </div>
</div>
<script>
  import { score } from "./model.js";

document.addEventListener('DOMContentLoaded', () => {
  // --- Dynamic Navbar Construction ---
  const navBar = document.createElement('header');
  Object.assign(navBar.style, {
    position: 'fixed',
    top: '0',
    left: '0',
    width: '100%',
    display: 'flex',
    justifyContent: 'space-between',
    alignItems: 'center',
    padding: '12px 40px',
    backgroundColor: 'rgba(15, 15, 15, 0.85)',
    backdropFilter: 'blur(12px)',
    webkitBackdropFilter: 'blur(12px)',
    borderBottom: '1px solid rgba(255, 255, 255, 0.1)',
    boxShadow: '0 4px 20px rgba(0, 0, 0, 0.4)',
    zIndex: '9999',
    boxSizing: 'border-box'
  });

  const logo = document.createElement('a');
  logo.innerText = '♟ EloPredict';
  logo.href = 'index.html';
  Object.assign(logo.style, {
    color: '#ffffff',
    textDecoration: 'none',
    fontFamily: "'Oswald', sans-serif",
    fontSize: '22px',
    fontWeight: 'bold',
    letterSpacing: '1px'
  });

  const navGroup = document.createElement('div');
  Object.assign(navGroup.style, { display: 'flex', alignItems: 'center', gap: '20px' });

  const homeBtn = document.createElement('a');
  homeBtn.innerText = 'Home';
  homeBtn.href = 'index.html';
  Object.assign(homeBtn.style, {
    color: 'rgba(255, 255, 255, 0.8)',
    textDecoration: 'none',
    fontFamily: "'Ubuntu', sans-serif",
    fontSize: '15px',
    fontWeight: '700',
    padding: '8px 12px'
  });

  const dropdownContainer = document.createElement('div');
  Object.assign(dropdownContainer.style, { position: 'relative', display: 'inline-block' });

  const dropdownTrigger = document.createElement('button');
  dropdownTrigger.innerText = 'Other Pages ▾';
  Object.assign(dropdownTrigger.style, {
    color: '#ffffff',
    backgroundColor: '#2563eb',
    border: 'none',
    fontFamily: "'Ubuntu', sans-serif",
    fontSize: '14px',
    fontWeight: '700',
    padding: '8px 18px',
    borderRadius: '20px',
    cursor: 'pointer'
  });

  const dropdownMenu = document.createElement('div');
  Object.assign(dropdownMenu.style, {
    display: 'none',
    position: 'absolute',
    right: '0',
    top: '100%',
    marginTop: '8px',
    backgroundColor: 'rgba(25, 25, 25, 0.95)',
    minWidth: '220px',
    borderRadius: '12px',
    border: '1px solid rgba(255, 255, 25, 0.1)',
    overflow: 'hidden',
    zIndex: '10000'
  });

  const blackPlayerLink = document.createElement('a');
  blackPlayerLink.innerText = 'Black Player Elo Prediction';
  blackPlayerLink.href = 'page2.html';

  const whitePlayerLink = document.createElement('a');
  whitePlayerLink.innerText = 'White Player Elo Prediction';
  whitePlayerLink.href = 'UI.html';

  const itemStyle = {
    color: '#ffffff',
    padding: '12px 16px',
    textDecoration: 'none',
    display: 'block',
    fontFamily: "'Ubuntu', sans-serif",
    fontSize: '13px',
    fontWeight: 'bold'
  };

  Object.assign(blackPlayerLink.style, itemStyle);
  Object.assign(whitePlayerLink.style, itemStyle);

  dropdownMenu.appendChild(blackPlayerLink);
  dropdownMenu.appendChild(whitePlayerLink);
  dropdownContainer.appendChild(dropdownTrigger);
  dropdownContainer.appendChild(dropdownMenu);

  dropdownTrigger.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = dropdownMenu.style.display === 'block';
    dropdownMenu.style.display = isOpen ? 'none' : 'block';
  });

  document.addEventListener('click', (e) => {
    if (!dropdownContainer.contains(e.target)) {
      dropdownMenu.style.display = 'none';
    }
  });

  navGroup.appendChild(homeBtn);
  navGroup.appendChild(dropdownContainer);
  navBar.appendChild(logo);
  navBar.appendChild(navGroup);

  // Insert navbar at the top of <body>
  document.body.insertBefore(navBar, document.body.firstChild);

  // --- Form & Button Handling ---
  const inac = document.getElementById("inac");
  const miss = document.getElementById("miss");
  const moves = document.getElementById("moves");
  const Result_1_0 = document.getElementById("Result_1-0");
  const Result_1_2 = document.getElementById("Result_1/2-1/2");
  const predictBtn = document.getElementById("result"); 

  if (predictBtn) {
    predictBtn.addEventListener("click", getstuff);
  }

  function getstuff() {
    const moveCount = Number(moves?.value || 0);
    const missCount = Number(miss?.value || 0);
    const inacCount = Number(inac?.value || 0);
    const result1 = Number(Result_1_0?.value || 0);
    const result2 = Number(Result_1_2?.value || 0);

    // Compute error rate for model's input[5]
    const validMoves = moveCount > 0 ? moveCount : 1;
    const errorRate = (missCount + inacCount) / validMoves;

    // Feature array expected by model.js:
    // [0] Inaccuracies, [1] Mistakes, [2] Total Moves, [3] Result White, [4] Result Black, [5] Error Rate
    const features = [missCount, inacCount, moveCount, result1, result2,];

    const predictedElo = Math.round(score(features));
    
    const outputElement = document.getElementById("output");
    if (outputElement) {
      outputElement.textContent = predictedElo;
    }
  }
});
</script>
</body>
</html>
